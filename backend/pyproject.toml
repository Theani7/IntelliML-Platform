[tool.poetry]
name = "intelliml-platform"
version = "1.0.0"
description = "IntelliML Platform Backend"
authors = ["IntelliML Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.136.0"
uvicorn = {extras = ["standard"], version = "0.46.0"}
pydantic = "2.12.4"
pydantic-settings = "2.12.0"
python-multipart = "0.0.26"
groq = "1.2.0"
scikit-learn = "1.8.0"
pandas = "3.0.2"
numpy = "2.4.4"
xgboost = "2.0.3"
lightgbm = "4.3.0"
shap = "0.44.1"
matplotlib = "3.8.2"
seaborn = "0.13.1"
plotly = "5.18.0"
reportlab = "4.0.9"
openpyxl = "3.1.2"
python-jose = "3.3.0"
passlib = "1.7.4"
python-dateutil = "2.8.2"
python-dotenv = "1.0.0"
loguru = "0.7.2"
tenacity = "8.2.3"
validators = "0.22.0"
joblib = "1.3.2"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.4"
pytest-asyncio = "0.23.3"
httpx = "0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"